<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gestor de correos · {% block titulo %}Inicio{% endblock %}</title>
  <style>
    :root{--or:#E8620C;--or2:#C9520A;--ink:#1D2129;--mut:#5B6270;--line:#DDE1E6;--bg:#F4F5F7}
    *{box-sizing:border-box}body{margin:0;font-family:"Segoe UI",system-ui,sans-serif;color:var(--ink);background:var(--bg);font-size:14px}
    .btn{white-space:nowrap;font:inherit;font-size:14px;font-weight:600;padding:9px 18px;border-radius:4px;border:1px solid #C3C8D0;background:#fff;color:var(--ink);cursor:pointer}
    .btn:focus-visible{outline:2px solid var(--or);outline-offset:2px}
    .btn.pri{background:var(--or);border-color:var(--or);color:#fff}.btn.pri:hover{background:var(--or2)}
    .btn[disabled]{opacity:.45;cursor:not-allowed}
    .pill{display:inline-block;font-size:12px;font-weight:600;padding:3px 10px;border-radius:4px}
    .p-or{background:#FDEBDD;color:#A9450A}.p-ok{background:#E5F4EC;color:#1E7B46}.p-er{background:#FDECEA;color:#B42318}
    .lbl{font-size:12px;color:var(--mut)}
    .row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
    .box{background:#fff;border:1px solid var(--line);border-radius:6px}
    .strip{display:flex;align-items:center;gap:14px;padding:14px 18px;border:1px solid #F3C9A8;background:#FFF8F2;border-radius:6px}
    .app{max-width:1180px;margin:0 auto;padding:0 40px}
    .hdr{background:#fff;border-bottom:1px solid var(--line)}.hdr .app{display:flex;align-items:center;height:60px;gap:28px}
    .hdr nav a{color:var(--mut);text-decoration:none;padding:20px 0;margin-right:22px}.hdr nav a.on{color:var(--ink);font-weight:600;border-bottom:2px solid var(--or)}
    h2{font-size:15px;margin:0 0 14px;font-weight:600}
    select{font:inherit;font-size:14px;padding:7px 10px;border:1px solid #C3C8D0;border-radius:4px;background:#fff}
    table{width:100%;border-collapse:collapse}td{padding:8px 0;border-bottom:1px solid #EEF0F2}td.n{text-align:right;font-weight:600;font-variant-numeric:tabular-nums}
    .ev{display:grid;grid-template-columns:70px 100px 1fr auto;gap:16px;align-items:center;padding:14px 20px;border-bottom:1px solid #EEF0F2;cursor:pointer}
    .ev:hover{background:#FAFAFB}.ev .t{color:var(--mut);font-variant-numeric:tabular-nums}.ev .s{font-weight:600}
    .lnk{font:inherit;font-size:13px;color:var(--mut);background:none;border:0;cursor:pointer;text-decoration:underline}
    .ok{color:#1E7B46;font-weight:600}.er{color:#B42318;font-weight:600}.ac{background:#FFF8F2}
    .det{display:none;padding:0 20px 16px 226px;border-bottom:1px solid #EEF0F2}.det.on{display:block}
    .det pre{margin:6px 0 0;padding:10px 12px;background:#F4F5F7;border:1px solid var(--line);border-radius:4px;font:12px Consolas,"Cascadia Mono",monospace;white-space:pre-wrap}
    .seg{display:inline-flex;border:1px solid #C3C8D0;border-radius:4px;overflow:hidden}.seg a,.seg button{font:inherit;font-size:13px;border:0;background:#fff;padding:7px 14px;cursor:pointer;color:var(--ink);text-decoration:none}
    .seg a.on,.seg button.on{background:#2A2F38;color:#fff}
    .sg{display:inline-flex;background:#ECEEF1;border-radius:6px;padding:3px;gap:2px}
    .sg form{display:inline}.sg button{font:inherit;font-size:13px;font-weight:600;border:0;background:none;color:var(--mut);padding:6px 14px;border-radius:4px;cursor:pointer;white-space:nowrap}
    .sg button.on{background:#FDEBDD;color:#A9450A}.sg button:disabled.on{opacity:1;cursor:default}.sg button:focus-visible{outline:2px solid var(--or)}
    .ct td{padding:10px 0;font-size:14px}.ct td.n{font-weight:600}
    .banner{background:#FFF8F2;border:1px solid #F3C9A8;border-radius:6px;padding:12px 16px;margin:0 0 16px}
    .banner ul{margin:6px 0 0;padding-left:18px}
    form.inline{display:inline}
    @media(max-width:1100px){.cols{grid-template-columns:1fr!important}.app{padding:0 18px}}
  </style>
</head>
<body>
<header class="hdr"><div class="app">
  <div class="row">
    <svg width="26" height="26" viewBox="0 0 64 64" aria-hidden="true"><rect x="4" y="12" width="44" height="32" rx="4" fill="#E8620C"/><path d="M6 15l20 15 20-15" stroke="#fff" stroke-width="3.5" fill="none"/><circle cx="48" cy="44" r="13" fill="#2A2F38" stroke="#fff" stroke-width="2.5"/><path d="M42 40h9m-3-3l3 3-3 3M54 48h-9m3-3l-3 3 3 3" stroke="#fff" stroke-width="2.2" fill="none"/></svg>
    <b style="font-size:18px;font-weight:600">Gestor de correos</b>
  </div>
  <nav>
    <a href="/" class="{% if pagina_activa == 'inicio' %}on{% endif %}">Inicio</a>
    <a href="/actividad" class="{% if pagina_activa == 'actividad' %}on{% endif %}">Actividad</a>
  </nav>
</div></header>
<main class="app" style="padding-top:28px;padding-bottom:48px">
  {% if alertas %}
  <div class="banner"><strong>Avisos</strong><ul>{% for a in alertas %}<li><span class="lbl">{{ a.fecha }}</span> · <strong>{{ a.titulo }}</strong>{% if a.detalle %} — {{ a.detalle[:220] }}{% endif %}</li>{% endfor %}</ul></div>
  {% endif %}
  {% block contenido %}{% endblock %}
</main>
{% block scripts %}{% endblock %}
</body>
</html>
